; Values every matching export preset must carry. A section names the presets it
; applies to as a glob over their names, so one entry covers a storefront, a platform, a
; component or an architecture. `godot-check --fix` writes them into
; 'export_presets.cfg', with the editor closed; everything the editor owns is left
; alone. See
; https://github.com/coffeebeats/godot-infra/blob/v6/plugins/godot/checker/README.md.

[*]

export_filter="all_resources"
export_files=PackedStringArray()
exclude_filter=["addons/gut", "*_test.gd", "*/tests/*", "icon.svg", "addons/std/editor/icons/state_machine.svg"]

; GodotSteam must not join the shared list; the '-steam' presets ship the extension.
[*-unknown]

exclude_filter=["addons/godotsteam"]

[*-macos-*]

options/application/bundle_identifier="com.coffeebeats.game"
options/application/app_category="Games"
options/application/min_macos_version_x86_64="10.15"
options/application/min_macos_version_arm64="11.00"

[*-windows-*]

options/application/export_angle=2

[*-windows-unknown]

options/binary_format/embed_pck=true

[*-windows-steam]

options/binary_format/embed_pck=false
