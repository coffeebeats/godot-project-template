; Values every matching export preset must carry. A section names the presets it applies
; to as a glob over their names, so one entry covers a storefront, a platform, a
; component or an architecture. `godot-check --fix export_presets.cfg` writes them into
; the presets, with the editor closed. Everything the editor owns is left alone. See
; https://github.com/coffeebeats/godot-infra/blob/v6/plugins/godot/checker/README.md.

[*]

export_filter="all_resources"
exclude_filter=["addons/gut", "*_test.gd", "*/tests/*", "*.po", "*.pot", "icon.svg", "*/editor/*"]

; GodotSteam must not join the shared list; the '-steam' presets ship the extension.
; '*/steam/*' goes with it, which holds while nothing outside a 'steam' directory
; names something inside one. The checker's 'export-ref' rule reports it if that slips.
[*-unknown]

exclude_filter=["addons/godotsteam", "*/steam/*"]

; 'godotsteam_plugin.gd' is not an enabled editor plugin, and the extension's
; '.gdextension' names only the platform libraries. Its 'editor' directory is '[*]'s.
[*-steam]

exclude_filter=["addons/godotsteam/godotsteam_plugin.gd"]

[*-macos-*]

options/application/bundle_identifier="com.coffeebeats.game"
options/application/app_category="Games"
options/application/min_macos_version_x86_64="10.15"
options/application/min_macos_version_arm64="11.00"

[*-windows-*]

options/application/export_angle=2

[*-windows-unknown]

options/binary_format/embed_pck=true

[*-windows-steam]

options/binary_format/embed_pck=false
