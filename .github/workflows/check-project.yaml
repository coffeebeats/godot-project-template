name: "🔎 Check: Godot project"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    uses: coffeebeats/godot-infra/.github/workflows/check-project.yaml@v6
    secrets: inherit

  # Used to ensure all branch protection requirements are met. This is a workaround until
  # https://github.com/github-community/community/discussions/4324 is addressed.
  #
  # NOTE: A job inside a reusable workflow reports as '<caller-job> / <job>',
  # which a branch ruleset cannot require, so the aggregate has to live here.
  branch_protection:
    needs: ["check"]
    if: ${{ always() }}

    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Verify status of dependencies
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
