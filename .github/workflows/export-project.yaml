name: "🎮 Export: Godot project"

on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: "The branch or tag name to check out. If empty, uses either the triggering event's SHA or the HEAD commit of the default branch."
        required: false
      component:
        type: string
        description: "Build only the presets whose name begins with this component. If empty, every preset for the requested platform, architecture and storefront is built and packaged together."
        required: false
        default: ""
      platform:
        type: string
        required: true
      arch:
        type: string
        required: true
      storefront:
        type: string
        required: true
      profile:
        type: string
        required: true
      publish-export-template:
        type: boolean
        required: false
        default: false
    outputs:
      name:
        description: "The name of the artifact containing the exported game."
        value: ${{ jobs.package.outputs.artifact-name }}

permissions:
  actions: write # Allows this workflow to delete its temporary cache(s).
  contents: read # Required to check out a private repository.

defaults:
  run:
    shell: bash

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    outputs:
      presets: ${{ steps.set-presets.outputs.value }}
      artifact-name: ${{ steps.set-presets.outputs.artifact-name }}
      artifact-pattern: ${{ steps.set-presets.outputs.artifact-pattern }}
      godot-version: "${{ steps.version.outputs.semantic }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}

      - uses: coffeebeats/godot-infra/.github/actions/parse-godot-version@v5
        id: version
        with:
          gdenv-pin-path: .godot-version

      - name: Evaluate presets
        id: set-presets
        # NOTE: These inputs reach the script through the environment rather
        # than interpolation, so a dispatch-supplied 'component' cannot arrive
        # as shell code.
        env:
          COMPONENT: "${{ inputs.component }}"
          PROFILE: "${{ inputs.profile }}"
          TARGET: "${{ inputs.arch }}-${{ inputs.platform }}-${{ inputs.storefront }}"
        run: |-
          # A preset belongs to this build when its name ends with the target
          # at a segment boundary and, when a component is named, begins with
          # that component. Each 'case' pattern quotes its variable, so glob
          # characters in a component match literally.
          #
          # NOTE: Several presets can match; they package into one artifact.
          PRESETS=()

          while IFS= read -r NAME; do
            case "$NAME" in
            "$TARGET" | *-"$TARGET") ;;
            *) continue ;;
            esac

            if [ -n "$COMPONENT" ]; then
              case "$NAME" in
              "$COMPONENT"-*) ;;
              *) continue ;;
              esac
            fi

            PRESETS+=("$NAME")
          done < <(grep '^name=' export_presets.cfg | sed 's/name=//' | sed 's/"//g')

          if [ ${#PRESETS[@]} -eq 0 ]; then
            echo "::error::'export_presets.cfg' defines no preset matching '${COMPONENT:+$COMPONENT-}*$TARGET'."
            exit 1
          fi

          echo value=$(jq -c -n '$ARGS.positional' --args "${PRESETS[@]}") >> $GITHUB_OUTPUT

          # With no component to name it after, the artifact takes the project
          # name, which stays 'game' until a project renames it.
          echo "artifact-name=${COMPONENT:-game}-$TARGET-$PROFILE" >> "$GITHUB_OUTPUT"

          # The 'package' job downloads what the 'export' job publishes as
          # 'export-<preset>', so this glob mirrors the rule above. Anchoring
          # the end stops 'steam' from selecting 'steamdeck'.
          echo "artifact-pattern=export-${COMPONENT:+$COMPONENT-}*$TARGET" >> "$GITHUB_OUTPUT"

  compile:
    needs: ["config"]

    runs-on: ubuntu-latest
    timeout-minutes: 120

    outputs:
      key: ${{ steps.cache.outputs.key }}
      cache-path: ${{ steps.cache.outputs.path }}
      export-template-filename: ${{ steps.compile.outputs.export-template-filename }}
      extra-bundled-files: ${{ steps.compile.outputs.extra-bundled-files }}

    steps:
      - name: Reclaim disk space
        uses: coffeebeats/godot-infra/.github/actions/setup-runner@v5

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}

      - uses: coffeebeats/godot-infra/compile-godot-export-template@v5
        id: compile
        with:
          publish: ${{ inputs.publish-export-template }}

          godot-src-rev: ${{ needs.config.outputs.godot-version }}
          godot-patches: .patches/godotengine/godot/*

          platform: ${{ inputs.platform }}
          arch: ${{ inputs.arch }}

          custompy-path: ./custom.py
          icon-path: ./icon.svg
          profile: ${{ inputs.profile }}
          use-double-precision: false

          # FIXME: Set secrets for the project.
          encryption-key: ""

      # -------------------- Save export template artifact ------------------- #

      # NOTE: The export template passes between jobs through 'actions/cache'
      # rather than as an artifact, which is faster for small files.

      - name: Move the export template to the cache directory
        id: cache
        run: |-
          TARGET="${{ runner.temp }}/build"

          echo "Moving compiled export template artifacts to inter-job cache."
          echo "Source directory: ${{ steps.compile.outputs.path-artifact-dir }}"
          echo "Destination file: $TARGET"

          sudo mv ${{ steps.compile.outputs.path-artifact-dir }} ${{ runner.temp }}/build

          tree -lha --dirsfirst ${{ runner.temp }}/build

          echo path="$TARGET" >> $GITHUB_OUTPUT
          echo key='export-project-compile-${{ github.run_id }}-${{ inputs.component }}-${{ inputs.platform }}-${{ inputs.arch }}-${{ inputs.storefront }}-${{ inputs.profile }}' >> $GITHUB_OUTPUT

      - name: Cache the export template to pass between jobs
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ steps.cache.outputs.key }}
          path: ${{ steps.cache.outputs.path }}

  export:
    needs: ["config", "compile"]

    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: true

      matrix:
        preset: ${{ fromJson(needs.config.outputs.presets) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          submodules: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: ${{ needs.compile.outputs.key }}
          path: ${{ needs.compile.outputs.cache-path }}
          fail-on-cache-miss: true

      - name: Delete 'compile' job cache
        env:
          GH_TOKEN: ${{ github.token }} # Required by the 'gh' CLI.
        run: gh cache delete "${{ needs.compile.outputs.key }}"

      - name: Inspect compilation artifacts
        run: tree -lha --dirsfirst ${{ needs.compile.outputs.cache-path }}

      # ----------------------- Export required presets ---------------------- #

      # NOTE: The 'compile' job emits bundle filepaths relative to the cache
      # directory, so this step makes them absolute.
      - name: Compute 'extra-bundled-files'
        id: bundle
        run: |
          {
            echo "files<<EOM"

            for pattern in ${{ needs.compile.outputs.extra-bundled-files }}; do
                echo "${{ needs.compile.outputs.cache-path }}/$pattern"
            done

            echo "EOM"
          } >> "$GITHUB_OUTPUT"

      - uses: coffeebeats/godot-infra/export-godot-project-preset@v5
        with:
          publish: true
          artifact-name: "export-${{ matrix.preset }}"

          preset-name: "${{ matrix.preset }}"

          godot-editor-version: ${{ needs.config.outputs.godot-version }}
          export-template-path: "${{ needs.compile.outputs.cache-path }}/${{ needs.compile.outputs.export-template-filename }}"
          extra-bundled-files: ${{ steps.bundle.outputs.files }}

          profile: ${{ inputs.profile }}

          # FIXME: Set secrets for the project.
          encryption-key: ""

          # Windows
          codesign-identity-type: ""
          codesign-identity: ""
          codesign-password: ""

          # MacOS
          codesign-certificate-file: ""
          codesign-certificate-password: ""
          codesign-provisioning-profile: ""
          notarization-api-uuid: ""
          notarization-api-key: ""
          notarization-api-key-id: ""
          notarization-apple-id-name: ""
          notarization-apple-id-password: ""

  package:
    needs: ["config", "export"]

    outputs:
      artifact-name: ${{ needs.config.outputs.artifact-name }}

    env:
      ARTIFACT_NAME: ${{ needs.config.outputs.artifact-name }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download export preset artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/presets

          pattern: ${{ needs.config.outputs.artifact-pattern }}
          merge-multiple: true

      # NOTE: These are intermediate artifacts which don't need to be published.
      - name: Delete export preset artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118
        with:
          name: ${{ needs.config.outputs.artifact-pattern }}

      - name: Inspect game artifacts
        run: tree -lha --dirsfirst ${{ runner.temp }}/presets

      - name: Assemble the final game artifact
        id: artifact
        run: |-
          shopt -s extglob
          shopt -s globstar

          LABEL="${{ env.ARTIFACT_NAME }}"

          cd ${{ runner.temp }}/presets

          ls -ls

          ARCHIVE_PATH="${{ runner.temp }}/${LABEL}.tar.gz"

          # NOTE: The archive preserves permissions, without which MacOS
          # application bundles do not run once downloaded.
          tar \
            --strip-components 1 \
            -czf $ARCHIVE_PATH \
            *

          echo "Packaged export game artifacts into archive: $ARCHIVE_PATH"
          ls -ls $ARCHIVE_PATH

          echo "label=$LABEL" >> $GITHUB_OUTPUT
          echo "path=$ARCHIVE_PATH" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artifact.outputs.label }}
          path: ${{ steps.artifact.outputs.path }}
