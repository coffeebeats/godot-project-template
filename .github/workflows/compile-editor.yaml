name: "🤖 Compile: Godot editor"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: "The target platform for the editor build."
        required: true
        default: windows
        options:
          - macos
          - windows
      arch:
        type: choice
        description: "The target CPU architecture for the editor build."
        required: true
        default: x86_64
        options:
          - arm64
          - x86_64
      profile:
        type: choice
        description: "The optimization profile of the compiled export template."
        required: true
        default: release
        options:
          - release
          - release_debug
          - debug

permissions:
  contents: read

jobs:
  # NOTE: Both triggers reach one call because the reusable workflow branches on
  # 'github.event_name', which inside it is this workflow's event. A 'push' run
  # builds only when the pin or the engine patches changed.
  compile:
    uses: coffeebeats/godot-infra/.github/workflows/compile-editor.yaml@v6
    secrets: inherit
    with:
      # NOTE: These are dispatch-only, and are unset on a 'push'. The fallbacks
      # keep an empty value from overriding the reusable workflow's defaults.
      platform: ${{ inputs.platform || 'windows' }}
      arch: ${{ inputs.arch || 'x86_64' }}
      profile: ${{ inputs.profile || 'release' }}
