name: "🌐 Publish: Godot game"

on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        description: "The branch, tag or commit at which to build and publish the game."
        required: true
      version:
        type: string
        description: "The version to publish the game as (default: the value of 'ref')."
        required: false
      component:
        type: string
        description: "Build only the presets whose name begins with this component. If empty, every preset matching the target is built and published together."
        required: false
        default: ""

      platform:
        type: choice
        description: "The platform of the exported game."
        required: true
        default: windows
        options:
          - macos
          - windows
          - web
      arch:
        type: choice
        description: "The CPU architecture of the exported game."
        required: true
        default: x86_64
        options:
          - arm64
          - x86_64
          - universal
          - wasm32
      storefront:
        type: choice
        description: "The distribution storefront targeted by the game."
        required: true
        default: unknown
        options:
          - unknown
          - steam
      profile:
        type: choice
        description: "The optimization profile of the exported game."
        required: false
        default: release
        options:
          - release
          - release_debug
          - debug

      publish-export-template:
        type: boolean
        description: "Whether to publish the export template as an artifact."
        required: false
        default: false

      # itch.io inputs
      publish-to-itchio:
        type: boolean
        description: "Whether to publish the game to itch.io."
        required: false
        default: false
      itchio-project:
        type: string
        description: "The name of the itch.io project (required when publishing)."
        required: false
      itchio-label:
        type: string
        description: "The channel label to release the game to (e.g. 'beta')."
        required: false
        default: "release"

permissions:
  contents: read

jobs:
  publish:
    uses: coffeebeats/godot-infra/.github/workflows/publish-game.yaml@v6
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      component: ${{ inputs.component }}
      platform: ${{ inputs.platform }}
      arch: ${{ inputs.arch }}
      storefront: ${{ inputs.storefront }}
      profile: ${{ inputs.profile }}
      publish-export-template: ${{ inputs.publish-export-template }}

      # itch.io inputs
      publish-to-itchio: ${{ inputs.publish-to-itchio }}
      itchio-project: ${{ inputs.itchio-project }}
      itchio-label: ${{ inputs.itchio-label }}
